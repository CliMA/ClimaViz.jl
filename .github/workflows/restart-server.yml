name: Restart ClimaViz service on VM

on:
  workflow_dispatch:

jobs:
  restart-service:
    runs-on: ubuntu-latest

    steps:
      - name: Set up SSH agent with VM key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VM_SSH_KEY }}

      - name: Restart ClimaViz systemd service on VM
        run: |
          ssh -o StrictHostKeyChecking=no \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} \
            'sudo systemctl restart climaviz.service'

